<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Marine — Direction Variants</title>
  <style>
    :root {
      --bg: #0a0d12;
      --panel: #11161d;
      --panel-2: #161c25;
      --border: #1f2630;
      --border-2: #2a323d;
      --text: #d6dde6;
      --muted: #6b7480;
      --dim: #4a525c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); }
    body {
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", "Helvetica", "Arial", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      padding: 28px 36px 80px;
      min-height: 100vh;
    }
    .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }

    header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 4px; }
    h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.01em; margin: 0; color: var(--text); }
    .crumb { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 12px; max-width: 740px; }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 28px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 24px;
    }
    .toolGroup { display: flex; align-items: center; gap: 10px; }
    .toolGroup .label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

    .accentRow { display: flex; gap: 6px; }
    .swatch {
      width: 22px; height: 22px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer; padding: 0;
      position: relative;
    }
    .swatch.active { box-shadow: 0 0 0 2px var(--text); }
    .swatch span {
      position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase;
      white-space: nowrap;
    }

    .bgRow { display: flex; gap: 6px; }
    .bgBtn {
      width: 26px; height: 22px; border-radius: 4px;
      border: 1px solid var(--border-2);
      cursor: pointer; padding: 0;
    }
    .bgBtn.active { box-shadow: 0 0 0 2px var(--text); }

    .scaleRow { display: inline-flex; background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 4px; overflow: hidden; }
    .scaleRow button {
      background: transparent; border: 0; color: var(--muted);
      font-size: 11px; padding: 5px 12px; cursor: pointer; letter-spacing: 0.04em;
      font-family: inherit;
    }
    .scaleRow button.active { background: #1f2832; color: var(--text); }

    .checkbox { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; user-select: none; }
    .checkbox input { margin: 0; }

    /* Variant grid */
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px 18px 16px;
      display: flex; flex-direction: column;
    }
    .cardHead {
      display: flex; align-items: baseline; gap: 10px;
      margin-bottom: 10px;
    }
    .cardLabel {
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    }
    .cardLabel b { color: var(--text); font-weight: 600; }
    .cardTitle { font-size: 13px; font-weight: 600; color: var(--text); }
    .cardSub { font-size: 11px; color: var(--muted); margin: 0 0 14px; min-height: 32px; }

    .stage {
      border-radius: 4px; overflow: hidden;
      border: 1px solid var(--border-2);
      display: grid; place-items: center;
      padding: 12px;
      min-height: 240px;
    }
    .stageRow {
      display: flex; gap: 18px; align-items: flex-end; justify-content: center; width: 100%;
    }
    .spritePane { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .spritePane .cap { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }

    /* Accent matrix block */
    .matrix {
      margin-top: 36px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px 20px 20px;
    }
    .matrixHead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .matrixGrid {
      display: grid; gap: 0;
      grid-template-columns: 80px repeat(6, 1fr);
      grid-auto-rows: 1fr;
      border: 1px solid var(--border-2);
      border-radius: 4px;
      overflow: hidden;
    }
    .matrixGrid > div {
      border-right: 1px solid var(--border-2);
      border-bottom: 1px solid var(--border-2);
      display: grid; place-items: center;
      padding: 10px 8px;
      min-height: 96px;
    }
    .matrixGrid > div:nth-child(7n) { border-right: 0; }
    .matrixGrid > div.head {
      background: var(--panel-2);
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
      min-height: 0; padding: 6px 8px;
    }
    .matrixGrid > div.rowLabel {
      justify-content: flex-start; padding-left: 14px;
      background: var(--panel-2);
      font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
    }

    .footer { margin-top: 36px; color: var(--muted); font-size: 11px; max-width: 760px; }
    .footer code { background: #1a1f27; padding: 1px 5px; border-radius: 3px; color: #c2cad4; font-size: 10.5px; }
    .notes { margin-top: 24px; }
    .notes h3 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    .notes p { color: var(--text); margin: 0 0 10px; font-size: 12.5px; }
    .notes ul { margin: 6px 0 14px; padding-left: 18px; }
    .notes li { margin: 3px 0; font-size: 12.5px; }
  </style>
</head>
<body>
  <header>
    <div class="crumb">Meridian · Command · Sprites</div>
    <span class="crumb" style="color:var(--dim)">/</span>
    <h1>Marine — Animation pilot (Variant B)</h1>
  </header>
  <p class="subtitle">
    All nine animations on the chosen scout marine: 7 persistent states + 2 transient one-shots.
    Component shipped at <code style="font-family:ui-monospace,monospace;background:#1a1f27;padding:1px 5px;border-radius:3px;color:#c2cad4;font-size:11.5px">src/lib/commandSprites/Marine.tsx</code>.
  </p>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="Marine.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
