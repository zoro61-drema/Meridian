[package]
name = "meridian"
version = "0.1.0"
description = "Meridian — Personal productivity desktop app for engineering teams"
authors = ["Isaac Harries"]
license = "Apache-2.0"
edition = "2021"
default-run = "meridian"

[lib]
name = "meridian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mock_acp"
path = "tests/fixtures/mock_acp.rs"
test = false
bench = false
doc = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "native-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "net", "time", "macros", "sync"] }
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22.1"
dirs = "6.0.0"
aes-gcm = "0.10"
sha2 = "0.10"
glob = "0.3"
regex-lite = "0.1"
cpal = "0.15"
whisper-rs = { version = "0.16", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-foundation = "0.10.1"
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
speakrs = { version = "0.4", default-features = false, features = ["online", "coreml", "openblas-static"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
